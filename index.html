<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Secret For You</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --ink: #2a1f14;
            --ink-f: #5c4733;
            --parch: #f2e8d5;
            --parch2: #e8dbc2;
            --parch3: #ddd0b3;
            --gold: #a07830;
            --gold2: #c8a050;
            --gold-dim: rgba(160, 120, 48, 0.18);
            --sepia: #8b6340;
            --seal: #7a1c1c;
            --seal2: #b03030;
            --dark: #0e0805;
            --dark2: #181210;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark);
            font-family: 'Montserrat', sans-serif;
            color: var(--parch);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        #motes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .mote {
            position: absolute;
            border-radius: 50%;
            background: rgba(200, 160, 80, 0.18);
            animation: moteFloat var(--md, 18s) ease-in-out var(--ml, 0s) infinite alternate;
        }

        @keyframes moteFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: .05;
            }

            50% {
                opacity: var(--mo, .15);
            }

            100% {
                transform: translate(var(--mx, 20px), var(--my, -30px)) scale(1.4);
                opacity: .05;
            }
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(201, 168, 76, 0.06) 0%, transparent 70%), radial-gradient(ellipse 40% 30% at 80% 80%, rgba(122, 28, 28, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .outer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* parchment card */
        .card {
            width: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(160, 120, 48, 0.07) 31px, rgba(160, 120, 48, 0.07) 32px),
                linear-gradient(160deg, var(--parch) 0%, var(--parch2) 50%, var(--parch3) 100%);
            border: 1px solid rgba(160, 120, 48, 0.3);
            box-shadow: 0 0 0 6px rgba(160, 120, 48, 0.05), 0 0 0 7px rgba(160, 120, 48, 0.1), 0 10px 60px rgba(0, 0, 0, 0.7);
            padding: 52px 52px 48px;
            position: relative;
            color: var(--ink);
            animation: cardIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 30% 20% at 0% 0%, rgba(100, 70, 30, 0.1) 0%, transparent 70%), radial-gradient(ellipse 20% 15% at 100% 100%, rgba(100, 70, 30, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* corner brackets */
        .c-tl,
        .c-tr,
        .c-bl,
        .c-br {
            position: absolute;
            width: 26px;
            height: 26px;
            pointer-events: none;
        }

        .c-tl {
            top: -1px;
            left: -1px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .c-tr {
            top: -1px;
            right: -1px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        .c-bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .c-br {
            bottom: -1px;
            right: -1px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        /* corner florals */
        .cf {
            position: absolute;
            width: 90px;
            height: 90px;
            pointer-events: none;
            opacity: 0;
            animation: cfIn 1s ease var(--cd, .4s) both;
        }

        @keyframes cfIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cf-tl {
            top: -3px;
            left: -3px;
        }

        .cf-tr {
            top: -3px;
            right: -3px;
            transform: scaleX(-1);
            animation: cfInR 1s ease .6s both;
        }

        @keyframes cfInR {
            from {
                opacity: 0;
                transform: scaleX(-1) scale(0.85);
            }

            to {
                opacity: 1;
                transform: scaleX(-1) scale(1);
            }
        }

        /* rule */
        .rule {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            opacity: 0;
            animation: rIn 1s ease .7s both;
        }

        @keyframes rIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .rl {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }

        .rd {
            width: 6px;
            height: 6px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* header */
        .hdr {
            text-align: center;
            margin-bottom: 32px;
            opacity: 0;
            animation: rIn 1s ease 1s both;
        }

        .hdr-sub {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: .65rem;
            letter-spacing: .5em;
            text-transform: uppercase;
            color: var(--sepia);
            margin-bottom: 10px;
        }

        .hdr-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-style: italic;
            font-weight: 300;
            color: var(--ink);
            line-height: 1.1;
        }

        .hdr-title span {
            color: var(--gold);
        }

        /* two-col layout */
        .body-row {
            display: flex;
            gap: 36px;
            align-items: flex-start;
        }

        /* polaroid */
        .pol-wrap {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: rIn 1s ease 1.2s both;
        }

        .polaroid {
            background: #fff;
            padding: 8px 8px 28px;
            border-radius: 2px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transform: rotate(-4deg);
            width: 140px;
            transition: transform .4s;
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.04);
        }

        .pol-img {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, rgba(160, 120, 48, .2), rgba(90, 60, 20, .3));
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1px;
            overflow: hidden;
        }

        .pol-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pol-cap {
            font-family: 'Cormorant Garamond', serif;
            font-size: .75rem;
            font-style: italic;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }

        /* keypad side */
        .kp-side {
            flex: 1;
            opacity: 0;
            animation: rIn 1s ease 1.4s both;
        }

        .kp-label {
            font-family: 'Playfair Display', serif;
            font-size: .72rem;
            font-style: italic;
            color: var(--sepia);
            letter-spacing: .2em;
            margin-bottom: 14px;
        }

        /* code display */
        .code-row {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .dbox {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(160, 120, 48, 0.35);
            background: rgba(160, 120, 48, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--ink);
            transition: all .2s;
            position: relative;
        }

        .dbox.filled {
            border-color: var(--gold);
            background: rgba(160, 120, 48, 0.1);
            box-shadow: 0 0 12px rgba(160, 120, 48, 0.2);
        }

        .dbox-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(160, 120, 48, .3);
        }

        /* keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .key {
            padding: 11px 0;
            border: 1px solid rgba(160, 120, 48, 0.25);
            background: rgba(160, 120, 48, 0.04);
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all .15s;
            letter-spacing: .05em;
        }

        .key:hover {
            background: rgba(160, 120, 48, 0.12);
            border-color: var(--gold);
        }

        .key:active {
            transform: scale(.95);
        }

        .key.dim {
            font-size: .75rem;
            color: var(--sepia);
        }

        .err {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: .8rem;
            color: var(--seal);
            min-height: 18px;
            animation: shake .3s ease both;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .hint {
            font-family: 'Montserrat', sans-serif;
            font-size: .6rem;
            letter-spacing: .15em;
            color: rgba(90, 70, 40, .5);
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--dark);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .7s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .ovl-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 5vw, 2rem);
            font-style: italic;
            color: var(--gold2);
            text-align: center;
            letter-spacing: .08em;
        }

        .ovl-sub {
            font-size: .6rem;
            letter-spacing: .5em;
            color: rgba(160, 120, 48, .45);
            font-style: normal;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        @media(max-width:480px) {
            .card {
                padding: 36px 24px 36px;
            }

            .body-row {
                flex-direction: column;
                align-items: center;
            }

            .pol-wrap {
                flex-direction: row;
                align-items: flex-end;
                gap: 16px;
            }

            .kp-side {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div id="motes"></div>

    <div class="outer">
        <div class="card">
            <div class="c-tl"></div>
            <div class="c-tr"></div>
            <div class="c-bl"></div>
            <div class="c-br"></div>

            <!-- corner florals -->
            <svg class="cf cf-tl" style="--cd:.3s" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <path d="M48 31 Q40 18 34 11 Q44 17 48 31Z" fill="rgba(160,120,48,0.09)" />
                    <path d="M60 20 Q55 8 50 4 Q57 10 60 20Z" fill="rgba(160,120,48,0.09)" />
                    <circle cx="78" cy="10" r="4" stroke-width="0.7" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <circle cx="34" cy="42" r="3" stroke-width="0.7" fill="rgba(160,120,48,0.08)" />
                    <circle cx="34" cy="42" r="1.3" fill="rgba(160,120,48,0.35)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>
            <svg class="cf cf-tr" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <path d="M48 31 Q40 18 34 11 Q44 17 48 31Z" fill="rgba(160,120,48,0.09)" />
                    <circle cx="78" cy="10" r="4" stroke-width="0.7" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <circle cx="34" cy="42" r="3" stroke-width="0.7" fill="rgba(160,120,48,0.08)" />
                    <circle cx="34" cy="42" r="1.3" fill="rgba(160,120,48,0.35)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>

            <div class="rule">
                <div class="rl"></div>
                <div class="rd"></div>
                <div class="rl"></div>
            </div>

            <div class="hdr">
                <div class="hdr-sub">A private message awaits</div>
                <div class="hdr-title">Enter the <span>Secret Code</span></div>
            </div>

            <div class="body-row">
                <!-- Polaroid -->
                <div class="pol-wrap">
                    <div class="polaroid">
                        <div class="pol-img">
                            <img src="assets/pg1.jpg" alt="Us" onerror="this.style.display='none'" />
                        </div>
                        <div class="pol-cap">Our special day</div>
                    </div>
                </div>

                <!-- Keypad -->
                <div class="kp-side">
                    <div class="kp-label">Enter passcode to continue</div>
                    <div class="code-row" id="codeRow">
                        <div class="dbox" id="d0">
                            <div class="dbox-dot"></div>
                        </div>
                        <div class="dbox" id="d1">
                            <div class="dbox-dot"></div>
                        </div>
                        <div class="dbox" id="d2">
                            <div class="dbox-dot"></div>
                        </div>
                        <div class="dbox" id="d3">
                            <div class="dbox-dot"></div>
                        </div>
                    </div>
                    <div class="keypad">
                        <button class="key" onclick="press('1')">1</button>
                        <button class="key" onclick="press('2')">2</button>
                        <button class="key" onclick="press('3')">3</button>
                        <button class="key" onclick="press('4')">4</button>
                        <button class="key" onclick="press('5')">5</button>
                        <button class="key" onclick="press('6')">6</button>
                        <button class="key" onclick="press('7')">7</button>
                        <button class="key" onclick="press('8')">8</button>
                        <button class="key" onclick="press('9')">9</button>
                        <button class="key dim" onclick="press('*')">✦</button>
                        <button class="key" onclick="press('0')">0</button>
                        <button class="key dim" onclick="back()">⌫</button>
                    </div>
                    <div class="err" id="errMsg"></div>
                    <div class="hint">Hint — her birthday date (DDMM)</div>
                </div>
            </div>

            <div class="rule" style="margin-top:28px;margin-bottom:0;animation-delay:1.6s;">
                <div class="rl"></div>
                <div class="rd" style="width:4px;height:4px"></div>
                <div class="rl"></div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="ovl-text">
            <div class="ovl-sub">Welcome</div>
            Something beautiful awaits…
        </div>
    </div>

    <script>
        const PASS = "0919"; let entered = "";
        function press(d) { if (entered.length >= 4) return; entered += d; upd(); if (entered.length === 4) setTimeout(check, 300); }
        function back() { entered = entered.slice(0, -1); upd(); document.getElementById('errMsg').textContent = ""; }
        function upd() {
            for (let i = 0; i < 4; i++) {
                const b = document.getElementById('d' + i);
                if (i < entered.length) { b.textContent = '●'; b.classList.add('filled'); }
                else { b.innerHTML = '<div class="dbox-dot"></div>'; b.classList.remove('filled'); }
            }
        }
        function check() {
            if (entered === PASS) {
                document.getElementById('overlay').classList.add('show');
                setTimeout(() => window.location.href = 'wish.html', 1800);
            } else {
                const e = document.getElementById('errMsg');
                e.textContent = 'Incorrect — please try again';
                e.style.animation = 'none'; e.offsetHeight; e.style.animation = 'shake .3s ease both';
                entered = ""; upd();
            }
        }
        // motes
        const mc = document.getElementById('motes');
        for (let i = 0; i < 20; i++) {
            const m = document.createElement('div'); m.className = 'mote';
            const sz = (Math.random() * 2.5 + 1).toFixed(1);
            m.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--md:${(Math.random() * 14 + 12).toFixed(1)}s;--ml:${(Math.random() * 10).toFixed(1)}s;--mo:${(Math.random() * 0.18 + 0.05).toFixed(2)};--mx:${(Math.random() * 40 - 20).toFixed(0)}px;--my:${(Math.random() * -40 - 10).toFixed(0)}px;`;
            mc.appendChild(m);
        }
    </script>
</body>

</html>
