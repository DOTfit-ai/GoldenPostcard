<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Are You Ready?</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@200;300;400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --ink: #2a1f14;
            --ink-f: #5c4733;
            --parch: #f2e8d5;
            --parch2: #e8dbc2;
            --parch3: #ddd0b3;
            --gold: #a07830;
            --gold2: #c8a050;
            --gold-dim: rgba(160, 120, 48, 0.18);
            --sepia: #8b6340;
            --seal: #7a1c1c;
            --dark: #0e0805;
            --dark2: #181210;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark);
            font-family: 'Montserrat', sans-serif;
            color: var(--parch);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        #motes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .mote {
            position: absolute;
            border-radius: 50%;
            background: rgba(200, 160, 80, 0.18);
            animation: moteFloat var(--md, 18s) ease-in-out var(--ml, 0s) infinite alternate;
        }

        @keyframes moteFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: .05;
            }

            50% {
                opacity: var(--mo, .15);
            }

            100% {
                transform: translate(var(--mx, 20px), var(--my, -30px)) scale(1.4);
                opacity: .05;
            }
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(201, 168, 76, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .outer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(160, 120, 48, 0.07) 31px, rgba(160, 120, 48, 0.07) 32px), linear-gradient(160deg, var(--parch) 0%, var(--parch2) 50%, var(--parch3) 100%);
            border: 1px solid rgba(160, 120, 48, 0.3);
            box-shadow: 0 0 0 6px rgba(160, 120, 48, 0.05), 0 0 0 7px rgba(160, 120, 48, 0.1), 0 10px 60px rgba(0, 0, 0, 0.7);
            padding: 52px 52px 48px;
            position: relative;
            color: var(--ink);
            animation: cardIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
            text-align: center;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 30% 20% at 0% 0%, rgba(100, 70, 30, 0.1) 0%, transparent 70%), radial-gradient(ellipse 20% 15% at 100% 100%, rgba(100, 70, 30, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .c-tl,
        .c-tr,
        .c-bl,
        .c-br {
            position: absolute;
            width: 26px;
            height: 26px;
            pointer-events: none;
        }

        .c-tl {
            top: -1px;
            left: -1px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .c-tr {
            top: -1px;
            right: -1px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        .c-bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .c-br {
            bottom: -1px;
            right: -1px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        /* corner florals */
        .cf {
            position: absolute;
            width: 90px;
            height: 90px;
            pointer-events: none;
            opacity: 0;
            animation: cfIn 1s ease var(--cd, .4s) both;
        }

        @keyframes cfIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cf-tl {
            top: -3px;
            left: -3px;
        }

        .cf-tr {
            top: -3px;
            right: -3px;
            transform: scaleX(-1);
            animation: cfInR 1s ease .6s both;
        }

        @keyframes cfInR {
            from {
                opacity: 0;
                transform: scaleX(-1) scale(0.85);
            }

            to {
                opacity: 1;
                transform: scaleX(-1) scale(1);
            }
        }

        .cf-bl {
            bottom: -3px;
            left: -3px;
            transform: scaleY(-1);
            animation: cfInSY 1s ease .8s both;
        }

        @keyframes cfInSY {
            from {
                opacity: 0;
                transform: scaleY(-1) scale(0.85);
            }

            to {
                opacity: 1;
                transform: scaleY(-1) scale(1);
            }
        }

        .cf-br {
            bottom: -3px;
            right: -3px;
            transform: scale(-1, -1);
            animation: cfInSXY 1s ease 1s both;
        }

        @keyframes cfInSXY {
            from {
                opacity: 0;
                transform: scale(-1, -1) scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(-1, -1) scale(1);
            }
        }

        .rule {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            opacity: 0;
            animation: rIn 1s ease .8s both;
        }

        @keyframes rIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .rl {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }

        .rd {
            width: 6px;
            height: 6px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* candles SVG row */
        .candles {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
            opacity: 0;
            animation: rIn 1s ease 1s both;
        }

        .candle {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bob var(--cf, 3s) ease-in-out infinite alternate;
        }

        @keyframes bob {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-4px);
            }
        }

        .fw {
            position: relative;
            width: 10px;
            height: 18px;
            margin-bottom: 1px;
        }

        .fo {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 17px;
            background: radial-gradient(ellipse at 50% 80%, #d4820a, #f5b830 55%, rgba(245, 184, 48, 0) 100%);
            border-radius: 50% 50% 35% 35%;
            animation: flick .9s ease-in-out infinite alternate;
        }

        .fi {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 8px;
            background: radial-gradient(ellipse at 50% 80%, rgba(255, 255, 240, .9), #fef3c7 80%);
            border-radius: 50% 50% 40% 40%;
            animation: flick .65s ease-in-out infinite alternate-reverse;
        }

        @keyframes flick {
            0% {
                transform: translateX(-50%) scaleX(1) scaleY(1);
            }

            100% {
                transform: translateX(-50%) scaleX(.82) scaleY(1.12);
            }
        }

        .cb {
            border-radius: 2px 2px 1px 1px;
            position: relative;
        }

        .cd {
            position: absolute;
            top: 0;
            width: 3px;
            height: 6px;
            border-radius: 0 0 3px 3px;
            opacity: .6;
        }

        .title-sm {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: .65rem;
            letter-spacing: .5em;
            text-transform: uppercase;
            color: var(--sepia);
            margin-bottom: 10px;
            opacity: 0;
            animation: rIn 1s ease 1.2s both;
        }

        .title-main {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            font-style: italic;
            font-weight: 300;
            color: var(--ink);
            line-height: 1.1;
            margin-bottom: 10px;
            opacity: 0;
            animation: rIn 1s ease 1.4s both;
        }

        .title-main span {
            color: var(--gold);
        }

        .title-body {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(.95rem, 2.5vw, 1.1rem);
            font-weight: 300;
            color: var(--ink-f);
            line-height: 1.8;
            margin-bottom: 32px;
            opacity: 0;
            animation: rIn 1s ease 1.6s both;
        }

        .title-body em {
            font-style: italic;
            color: var(--ink);
        }

        /* buttons */
        .btn-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: rIn 1s ease 1.9s both;
        }

        .btn {
            padding: 13px 40px;
            border: 1px solid rgba(160, 120, 48, .4);
            background: transparent;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-size: .72rem;
            font-style: italic;
            letter-spacing: .35em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color .4s, border-color .4s;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold);
            transform: translateX(-101%);
            transition: transform .4s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--parch);
            border-color: var(--gold2);
        }

        .btn:hover::before {
            transform: translateX(0);
        }

        .btn-no {
            border-color: rgba(160, 120, 48, .2);
            color: var(--sepia);
        }

        .btn-no:hover {
            color: var(--parch);
        }

        .funny {
            position: fixed;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: .9rem;
            background: rgba(122, 28, 28, .88);
            color: var(--parch);
            padding: 8px 18px;
            pointer-events: none;
            z-index: 200;
            animation: pop 1.2s ease both;
        }

        @keyframes pop {
            0% {
                opacity: 0;
                transform: scale(.5);
            }

            40% {
                opacity: 1;
                transform: scale(1.05);
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(.85);
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: var(--dark);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .7s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .ovl-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 5vw, 2rem);
            font-style: italic;
            color: var(--gold2);
            text-align: center;
            letter-spacing: .08em;
        }

        .ovl-sub {
            font-size: .6rem;
            letter-spacing: .5em;
            color: rgba(160, 120, 48, .45);
            font-style: normal;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        @media(max-width:480px) {
            .card {
                padding: 36px 24px 36px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div id="motes"></div>

    <div class="outer">
        <div class="card">
            <div class="c-tl"></div>
            <div class="c-tr"></div>
            <div class="c-bl"></div>
            <div class="c-br"></div>
            <svg class="cf cf-tl" style="--cd:.3s" viewBox="0 0 90 90" fill="none">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <path d="M48 31 Q40 18 34 11 Q44 17 48 31Z" fill="rgba(160,120,48,0.09)" />
                    <circle cx="78" cy="10" r="4" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <circle cx="34" cy="42" r="3" fill="rgba(160,120,48,0.08)" />
                    <circle cx="34" cy="42" r="1.3" fill="rgba(160,120,48,0.35)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>
            <svg class="cf cf-tr" viewBox="0 0 90 90" fill="none">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <path d="M48 31 Q40 18 34 11 Q44 17 48 31Z" fill="rgba(160,120,48,0.09)" />
                    <circle cx="78" cy="10" r="4" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <circle cx="34" cy="42" r="3" fill="rgba(160,120,48,0.08)" />
                    <circle cx="34" cy="42" r="1.3" fill="rgba(160,120,48,0.35)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>
            <svg class="cf cf-bl" viewBox="0 0 90 90" fill="none">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <circle cx="78" cy="10" r="4" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>
            <svg class="cf cf-br" viewBox="0 0 90 90" fill="none">
                <g stroke="#a07830" stroke-width="0.65" opacity="0.7">
                    <path d="M8 82 Q18 58 34 42 Q50 26 78 10" stroke-width="1" />
                    <path d="M34 42 Q23 32 18 20 Q29 25 34 42Z" fill="rgba(160,120,48,0.1)" />
                    <circle cx="78" cy="10" r="4" fill="rgba(160,120,48,0.08)" />
                    <circle cx="78" cy="10" r="1.8" fill="rgba(160,120,48,0.4)" />
                    <line x1="6" y1="6" x2="40" y2="6" stroke-width="0.5" />
                    <line x1="6" y1="6" x2="6" y2="40" stroke-width="0.5" />
                    <rect x="4" y="4" width="5" height="5" stroke-width="0.5" fill="rgba(160,120,48,0.12)" />
                </g>
            </svg>

            <div class="rule">
                <div class="rl"></div>
                <div class="rd"></div>
                <div class="rl"></div>
            </div>

            <!-- Candles -->
            <div class="candles">
                <div class="candle" style="--cf:3.2s">
                    <div class="fw">
                        <div class="fo"></div>
                        <div class="fi"></div>
                    </div>
                    <div class="cb"
                        style="width:7px;height:32px;background:linear-gradient(to bottom,#f2e8d5,#d4c5b0);">
                        <div class="cd" style="left:1px;background:#e0d0b8;"></div>
                    </div>
                </div>
                <div class="candle" style="--cf:2.7s">
                    <div class="fw">
                        <div class="fo"></div>
                        <div class="fi"></div>
                    </div>
                    <div class="cb"
                        style="width:8px;height:46px;background:linear-gradient(to bottom,#a07830,#6a4e18);">
                        <div class="cd" style="right:1px;background:#8a6520;"></div>
                    </div>
                </div>
                <div class="candle" style="--cf:3.8s">
                    <div class="fw" style="height:22px">
                        <div class="fo" style="width:12px;height:20px;"></div>
                        <div class="fi" style="width:5px;height:10px;"></div>
                    </div>
                    <div class="cb"
                        style="width:10px;height:58px;background:linear-gradient(to bottom,#f2e8d5,#c8b89e);">
                        <div class="cd" style="left:2px;background:#d8c8a8;"></div>
                    </div>
                </div>
                <div class="candle" style="--cf:2.9s">
                    <div class="fw">
                        <div class="fo"></div>
                        <div class="fi"></div>
                    </div>
                    <div class="cb"
                        style="width:8px;height:42px;background:linear-gradient(to bottom,#7a1c1c,#4a0f0f);">
                        <div class="cd" style="right:1px;background:#6a1818;"></div>
                    </div>
                </div>
                <div class="candle" style="--cf:3.5s">
                    <div class="fw">
                        <div class="fo"></div>
                        <div class="fi"></div>
                    </div>
                    <div class="cb"
                        style="width:7px;height:34px;background:linear-gradient(to bottom,#a07830,#6a4e18);">
                        <div class="cd" style="left:1px;background:#8a6520;"></div>
                    </div>
                </div>
            </div>

            <div class="title-sm">A gift is waiting for you</div>
            <div class="title-main">Are you <span>ready?</span></div>
            <div class="title-body">Something magical has been prepared —<br /><em>crafted with patience, sealed with
                    love.</em><br />When you are ready, step inside.</div>

            <div class="btn-row">
                <button class="btn" onclick="goYes()">I am ready &nbsp;→</button>
                <button class="btn btn-no" id="noBtn" onmouseover="runAway(event)" onclick="runAway(event)">Perhaps
                    not…</button>
            </div>

            <div class="rule" style="margin-top:32px;margin-bottom:0;animation-delay:2s;">
                <div class="rl"></div>
                <div class="rd" style="width:4px;height:4px"></div>
                <div class="rl"></div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="ovl-text">
            <div class="ovl-sub">one moment</div>
            Something beautiful awaits…
        </div>
    </div>

    <script>
        const mc = document.getElementById('motes');
        for (let i = 0; i < 20; i++) { const m = document.createElement('div'); m.className = 'mote'; const sz = (Math.random() * 2.5 + 1).toFixed(1); m.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--md:${(Math.random() * 14 + 12).toFixed(1)}s;--ml:${(Math.random() * 10).toFixed(1)}s;--mo:${(Math.random() * 0.18 + 0.05).toFixed(2)};--mx:${(Math.random() * 40 - 20).toFixed(0)}px;--my:${(Math.random() * -40 - 10).toFixed(0)}px;`; mc.appendChild(m); }
        function goYes() { document.getElementById('overlay').classList.add('show'); setTimeout(() => window.location.href = 'gifts.html', 1800); }
        const funny = ["You must say yes…", "Come now, be brave.", "That option does not exist.", "Try once more…", "Very well — yes it is."];
        let noN = 0; const nb = document.getElementById('noBtn');
        function runAway(e) {
            e.preventDefault(); noN++; nb.textContent = noN > 3 ? "Very well… yes." : "Perhaps not…"; if (noN > 4) { goYes(); return; }
            const mx = window.innerWidth - 180, my = window.innerHeight - 60;
            const x = Math.random() * mx, y = Math.random() * my;
            nb.style.cssText = `position:fixed;left:${x}px;top:${y}px;`;
            const ft = document.createElement('div'); ft.className = 'funny'; ft.textContent = funny[Math.min(noN - 1, funny.length - 1)];
            ft.style.cssText = `left:${x}px;top:${Math.max(y - 44, 10)}px;`;
            document.body.appendChild(ft); setTimeout(() => ft.remove(), 1200);
        }
    </script>
</body>

</html>
